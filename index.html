<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ball Battle</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0e0f12;--card:#17181d;--line:#2a2c34;--txt:#e9e9ee;--dim:#8b8d98;--acc:#ffc233}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;min-height:100dvh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select{touch-action:manipulation}
[hidden]{display:none!important}
.screen{max-width:780px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));padding-top:max(18px,env(safe-area-inset-top))}
h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 4px;color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mode{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:11px 14px;min-height:44px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.mode.on{border-color:var(--acc);color:var(--acc)}
.mdesc{font-size:12.5px;color:var(--dim);margin-bottom:14px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px}
.fcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c,#888);padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.pv{width:100%;max-width:170px;height:auto;aspect-ratio:1/1;align-self:center;background:#101115;border:1px solid var(--line)}
select,input[type=color]{background:#0f1014;border:1px solid var(--line);color:var(--txt);padding:7px 8px;font-size:14px;font-family:inherit;width:100%;border-radius:0}
input[type=color]{height:30px;padding:2px}
.row2{display:flex;gap:6px}
.row2 select{flex:1}.row2 input{width:48px;flex:none}
.info{font-size:12px;color:var(--dim);min-height:48px;line-height:1.35}
.x{position:absolute;top:0;right:0;width:40px;height:40px;background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}
.x:hover{color:#ff5a5a}
.teamsel{display:none}
.tm .teamsel{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:11px 15px;min-height:44px;font-size:14px;cursor:pointer;font-family:inherit}
button.btn:hover{border-color:var(--acc)}
button.go{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opt{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
#msg{color:#ff7a7a;font-size:13px;margin-top:8px;min-height:18px}
#battle{max-width:min(100%,calc(100vh - 215px),820px);max-width:min(100%,calc(100dvh - 215px),820px);min-width:280px;padding-top:max(8px,env(safe-area-inset-top));user-select:none;-webkit-user-select:none}
canvas#c{width:100%;aspect-ratio:1/1;display:block;background:#000;border:2px solid var(--line)}
.stats{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.st{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);padding:7px 9px;display:flex;gap:9px;align-items:center;min-width:0}
.st.dead{opacity:.35}
.st .av{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset -3px -4px 6px rgba(0,0,0,.45),inset 3px 3px 5px rgba(255,255,255,.3)}
.st .mid{flex:1;min-width:0}
.st .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .hb{height:6px;background:#0b0b0e;margin:4px 0 3px}
.st .hb i{display:block;height:100%;background:var(--c);width:100%;transition:width .15s}
.st .tx{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ctl label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
.ctl input[type=range]{min-height:32px}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:14px 0 max(8px,env(safe-area-inset-bottom));margin-top:8px;z-index:5}
.sticky .go{width:100%;min-height:50px;font-size:16px}
@media (max-width:560px){
  h1{font-size:14px}
  select,input[type=color]{font-size:16px}
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .fcard{padding:6px}
  .info{font-size:11.5px;min-height:62px}
  .modes{gap:5px}.mode{padding:10px 11px;font-size:12.5px;flex:1 1 auto}
  .st{padding:5px 7px;gap:6px}.st .av{width:24px;height:24px}.st .nm{font-size:12px}.st .tx{font-size:10.5px}
  .ctl .btn{flex:1 1 auto;padding:11px 8px;font-size:13px}
  .ctl label{flex:1 1 100%}.ctl label input{flex:1;width:auto!important}
}
@media (max-height:520px) and (orientation:landscape){
  #battle{max-width:none;width:100%;display:grid;grid-template-columns:min(calc(100vh - 20px),calc(100dvh - 20px),58vw) 1fr;grid-template-rows:1fr auto;gap:8px 10px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));align-items:start;min-width:0}
  #battle canvas#c{grid-row:1/3;grid-column:1;width:100%}
  #battle .stats{grid-column:2;grid-row:1;margin-top:0;grid-template-columns:1fr 1fr;max-height:calc(100dvh - 90px);overflow:auto;align-content:start}
  #battle .ctl{grid-column:2;grid-row:2;margin-top:0}
}
</style>
</head>
<body>

<div class="screen" id="ctor">
  <h1>Ball Battle — Constructor</h1>
  <div class="sub">Pick a game mode, then choose your fighters' abilities.</div>
  <div class="modes" id="modes"></div>
  <div class="mdesc" id="mdesc"></div>
  <div class="grid" id="list"></div>
  <div class="bar">
    <button class="btn" id="add">+ Add fighter</button>
    <button class="btn" id="preset">Random lineup</button>
    <label class="opt" id="shrinkWrap"><input type="checkbox" id="shrink" checked> Shrinking arena</label>
    <label class="opt"><input type="checkbox" id="snd" checked> Sound</label>
  </div>
  <div id="msg"></div>
  <div class="sticky"><button class="btn go" id="start">Start battle</button></div>
</div>

<div class="screen" id="battle" hidden>
  <canvas id="c" width="620" height="620"></canvas>
  <div class="stats" id="stats"></div>
  <div class="ctl">
    <button class="btn" id="edit">← Constructor</button>
    <button class="btn" id="again">Restart</button>
    <button class="btn" id="pause">Pause</button>
    <label>Speed <input type="range" id="spd" min="0.5" max="3" step="0.25" value="1" style="width:110px"></label>
  </div>
</div>

<script>
const W=620,H=620,BASE_R=30,BASE_HP=100,GOAL=45;
const AB={
 brawler:{n:'Brawler',i:'Boxing gloves. Heavy hits with big knockback.'},
 sword:{n:'Swordsman',i:'Spinning sword. Gets longer and deadlier with every hit.'},
 archer:{n:'Archer',i:'Keeps its distance and shoots arrows. Every 4th shot is a triple volley.'},
 splitter:{n:'Splitter',i:'Splits when hurt. After 6s every piece regrows to full size and can split again.'},
 freezer:{n:'Freezer',i:'Freezes enemies for 1.5s. Frozen balls take 50% more damage.'},
 bomber:{n:'Bomber',i:'Big explosion on death. Below 30% HP it rushes the nearest enemy.'},
 vampire:{n:'Vampire',i:'Hits harder and heals for 80% of the damage it deals.'},
 teleporter:{n:'Teleporter',i:'Teleports next to an enemy and stabs it on arrival.'},
 grower:{n:'Grower',i:'Starts small and slow. Grows over time and on wall hits: more HP and much more damage.'},
 shielder:{n:'Shielder',i:'Shield always faces the nearest enemy. Blocks 75% of damage from the front.'},
 ninja:{n:'Ninja',i:'Dashes at enemies every 2s. Dash hits deal triple damage.'},
 magnet:{n:'Magnet',i:'Pulls enemies in and crushes anyone who gets close.'},
 poisoner:{n:'Poisoner',i:'Every touch poisons: damage over time that stacks up.'},
 spiker:{n:'Spiker',i:'Spiked body. Hits hurt more and reflect damage back at attackers.'},
 zapper:{n:'Zapper',i:'Chain lightning that jumps between up to 3 enemies.'},
 berserker:{n:'Berserker',i:'The lower its HP, the faster it moves and the harder it hits.'},
 trapper:{n:'Trapper',i:'Plants mines that explode when enemies touch them.'}
};
const MODES={
 classic:{n:'Classic',d:'Free-for-all. Last ball standing wins.'},
 teams:{n:'Teams',d:'Red vs Blue. Choose a team for each fighter. Last team standing wins.'},
 koth:{n:'King of the Hill',d:'Stand alone in the glowing zone to score. First to '+GOAL+' points wins. Dead balls respawn.'},
 boss:{n:'Boss Fight',d:'All your fighters team up against one giant boss.'},
 chaos:{n:'Chaos',d:'Free-for-all with bouncing saw blades and health pickups.'}
};
const PAL=['#e5484d','#3e9bff','#f5b83d','#46c38a','#b06cff','#ff8a3d','#34d1d1','#ff6fa8'];
const TCOL=['#ff4d4d','#4da3ff'],TNAME=['RED','BLUE'];
let fighters=[],fid=1,AT=0,mode='classic';
function newF(type){const i=fighters.length;return{id:fid++,type,color:PAL[i%PAL.length],team:i%2}}
fighters=[newF('sword'),newF('archer'),newF('freezer'),newF('vampire')];
const $=id=>document.getElementById(id);

/* ---------- model drawing ---------- */
function shade(c,p){const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return `rgb(${r},${g},${b})`}
function leaf(g,x,y,len,ang,col){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=col;g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,-len*.5,len,0);g.quadraticCurveTo(len*.5,len*.5,0,0);g.fill();g.stroke();g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(len*.1,0);g.lineTo(len*.85,0);g.stroke();g.restore()}
function wing(g,x,y,r,side,color,flap){g.save();g.translate(x,y);g.scale(side,1);
 const f=1+flap*.2;
 g.beginPath();g.moveTo(r*.6,-r*.1);
 g.quadraticCurveTo(r*1.3,-r*1.6*f,r*2.4,-r*1.4*f);
 g.quadraticCurveTo(r*2.0,-r*.8*f,r*2.1,-r*.4);
 g.quadraticCurveTo(r*1.7,-r*.55,r*1.65,-r*.05);
 g.quadraticCurveTo(r*1.35,-r*.3,r*1.2,r*.35);
 g.quadraticCurveTo(r*1.0,r*.1,r*.6,r*.5);g.closePath();
 const gr=g.createLinearGradient(r*.6,0,r*2.4,-r);gr.addColorStop(0,'#1b0a24');gr.addColorStop(1,'#3d1a4f');g.fillStyle=gr;g.fill();
 g.strokeStyle=shade(color,-.1);g.lineWidth=2;g.stroke();
 g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1.5;g.beginPath();g.moveTo(r*.6,-r*.1);g.lineTo(r*2.4,-r*1.4*f);g.moveTo(r*.6,-r*.05);g.lineTo(r*1.65,-r*.05);g.moveTo(r*.6,r*.1);g.lineTo(r*1.2,r*.35);g.stroke();
 g.restore()}
function glove(g,x,y,r,ang){g.save();g.translate(x,y);g.rotate(ang);
 g.fillStyle='#fff';g.fillRect(-r*.9,-r*.5,r*.5,r);g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1.5;g.strokeRect(-r*.9,-r*.5,r*.5,r);
 const gr=g.createRadialGradient(r*.1,-r*.3,r*.1,0,0,r*.95);gr.addColorStop(0,'#ff7a7a');gr.addColorStop(1,'#a01818');
 g.fillStyle=gr;g.beginPath();g.arc(0,0,r*.85,0,6.283);g.fill();g.stroke();
 g.strokeStyle='rgba(0,0,0,.35)';g.beginPath();g.moveTo(r*.2,-r*.7);g.quadraticCurveTo(r*.55,0,r*.2,r*.7);g.stroke();
 g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(-r*.1,-r*.4,r*.3,r*.15,-.5,0,6.283);g.fill();g.restore()}
function spikes(g,x,y,r,n,rot,len,w,c1,c2){for(let k=0;k<n;k++){const a=rot+k*6.283/n;g.save();g.translate(x,y);g.rotate(a);
  const gr=g.createLinearGradient(r-4,0,r+len,0);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1.3;
  g.beginPath();g.moveTo(r-4,-w);g.lineTo(r+len,0);g.lineTo(r-4,w);g.closePath();g.fill();g.stroke();g.restore()}}
function mineIcon(g,x,y,rr,armed){g.fillStyle='#262932';g.strokeStyle='#0b0c10';g.lineWidth=1.5;
 for(let k=0;k<8;k++){const a=k*Math.PI/4;g.beginPath();g.moveTo(x+Math.cos(a-.2)*rr,y+Math.sin(a-.2)*rr);g.lineTo(x+Math.cos(a)*(rr+4),y+Math.sin(a)*(rr+4));g.lineTo(x+Math.cos(a+.2)*rr,y+Math.sin(a+.2)*rr);g.fill()}
 const gr=g.createRadialGradient(x-rr*.3,y-rr*.3,1,x,y,rr);gr.addColorStop(0,'#5a5f6d');gr.addColorStop(1,'#1c1e25');g.fillStyle=gr;g.beginPath();g.arc(x,y,rr,0,6.283);g.fill();g.stroke();
 const on=armed&&Math.sin(AT*9)>0;g.fillStyle=on?'#ff3b3b':'#5a1a1a';g.beginPath();g.arc(x,y,rr*.3,0,6.283);g.fill()}

function drawBall(g,b){
 const x=b.x,y=b.y,r=b.r,c=b.color,ty=b.type;
 for(let i=0;i<b.trail.length;i++){const p=b.trail[i],k=(i+1)/b.trail.length;g.globalAlpha=k*(ty==='ninja'&&b.dash>0?.5:.2);g.fillStyle=c;g.beginPath();g.arc(p.x,p.y,r*(.4+.5*k),0,6.283);g.fill()}
 g.globalAlpha=1;
 const frac=1-Math.max(0,b.hp)/b.max;
 // ---- behind the body ----
 if(ty==='vampire'){const fl=Math.sin(AT*11);wing(g,x,y,r,1,c,fl);wing(g,x,y,r,-1,c,fl)}
 if(ty==='freezer'){for(let k=0;k<8;k++){const a=k*Math.PI/4+AT*.35,L=r+10+(k%2)*7;g.save();g.translate(x,y);g.rotate(a);
   const gr=g.createLinearGradient(r-4,0,L,0);gr.addColorStop(0,'#bfe9ff');gr.addColorStop(1,'#eaf8ff');g.fillStyle=gr;g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=1.2;
   g.beginPath();g.moveTo(r-5,-7);g.lineTo(L,0);g.lineTo(r-5,7);g.closePath();g.fill();g.stroke();
   g.strokeStyle='rgba(120,190,240,.7)';g.beginPath();g.moveTo(r-2,0);g.lineTo(L-3,0);g.stroke();g.restore()}}
 if(ty==='spiker')spikes(g,x,y,r,12,AT*.5,13,6.5,'#d5d9e3','#7b8296');
 if(ty==='berserker'){const it=.35+frac*.9;for(let k=0;k<11;k++){const a=-Math.PI*1.05+k*(Math.PI*1.1/10),L=r*(.35+.55*it)*(.75+.35*Math.sin(AT*13+k*1.7));
   g.save();g.translate(x,y);g.rotate(a);g.fillStyle=k%2?'#ff7a1a':'#ffb21a';g.beginPath();g.moveTo(r-5,-7);g.quadraticCurveTo(r+L*.5,-5,r+L,0);g.quadraticCurveTo(r+L*.5,5,r-5,7);g.closePath();g.fill();g.restore()}}
 if(ty==='sword'){
  const L=b.len;g.save();g.translate(x,y);g.rotate(b.angle);
  const s=r+22;
  const bg=g.createLinearGradient(0,-7,0,7);bg.addColorStop(0,'#8e97aa');bg.addColorStop(.5,'#ffffff');bg.addColorStop(1,'#8e97aa');
  g.fillStyle=bg;g.strokeStyle='#4d5262';g.lineWidth=1.5;g.beginPath();g.moveTo(s,-7);g.lineTo(s+L-16,-6.5);g.lineTo(s+L,0);g.lineTo(s+L-16,6.5);g.lineTo(s,7);g.closePath();g.fill();g.stroke();
  g.strokeStyle='rgba(70,80,100,.75)';g.lineWidth=2;g.beginPath();g.moveTo(s+3,0);g.lineTo(s+L-20,0);g.stroke();
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1;g.beginPath();g.moveTo(s+8,-3);g.lineTo(s+L-24,-3);g.stroke();
  g.fillStyle='#d9a93a';g.strokeStyle='#6b4a0f';g.lineWidth=1.5;g.beginPath();g.moveTo(s-5,-15);g.quadraticCurveTo(s-9,-17,s-9,-12);g.lineTo(s-9,12);g.quadraticCurveTo(s-9,17,s-5,15);g.lineTo(s+2,9);g.lineTo(s+2,-9);g.closePath();g.fill();g.stroke();
  g.fillStyle='#e8432f';g.beginPath();g.arc(s-4,0,2.6,0,6.283);g.fill();
  g.fillStyle='#5a3418';g.fillRect(r+6,-4,s-9-(r+6),8);g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=1;g.strokeRect(r+6,-4,s-9-(r+6),8);
  g.strokeStyle='rgba(255,220,160,.5)';for(let u=r+8;u<s-10;u+=4){g.beginPath();g.moveTo(u,-4);g.lineTo(u+2,4);g.stroke()}
  g.fillStyle='#d9a93a';g.strokeStyle='#6b4a0f';g.beginPath();g.arc(r+4,0,5,0,6.283);g.fill();g.stroke();
  g.restore()}
 if(ty==='ninja'){const va=(b.vx||b.vy)?Math.atan2(b.vy,b.vx)+Math.PI:b.angle+Math.PI;
  for(let k=0;k<2;k++){g.save();g.translate(x+Math.cos(va)*r*.85,y+Math.sin(va)*r*.85-r*.22);g.rotate(va+(k?.28:-.28));g.fillStyle='#14161f';g.strokeStyle='#d33';g.lineWidth=1;
   g.beginPath();g.moveTo(0,-3);for(let u=1;u<=6;u++){g.lineTo(u*r*.17,-3+Math.sin(AT*14+u+k*2)*3)}for(let u=6;u>=0;u--){g.lineTo(u*r*.17,3+Math.sin(AT*14+u+k*2)*3)}g.closePath();g.fill();g.restore()}}
 // ---- shadow ----
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x+3,y+r*.88,r*.95,r*.3,0,0,6.283);g.fill();
 // ---- body ----
 const bgd=g.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r*1.05);bgd.addColorStop(0,shade(c,.6));bgd.addColorStop(.4,c);bgd.addColorStop(1,shade(c,-.6));
 g.fillStyle=bgd;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
 g.save();g.beginPath();g.arc(x,y,r,0,6.283);g.clip();
 if(ty==='splitter'){g.fillStyle='rgba(255,255,255,.2)';for(const [ox,oy,rr] of [[-.35,.25,.2],[.3,.35,.14],[.1,-.15,.11],[-.1,.55,.09]]){const w=Math.sin(AT*3+ox*9)*.04;g.beginPath();g.arc(x+r*ox,y+r*(oy+w),r*rr,0,6.283);g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.stroke()}}
 if(ty==='grower'){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1.5;for(const k of [.35,.62,.86]){g.beginPath();g.arc(x,y,r*k,0,6.283);g.stroke()}}
 if(ty==='poisoner'){g.fillStyle='rgba(120,255,90,.28)';for(let k=0;k<5;k++){const p=(AT*.5+k*.21)%1;g.beginPath();g.arc(x+Math.sin(k*2.3)*r*.5,y+r*(.9-p*1.8),r*(.08+.06*((k*7)%3)/2),0,6.283);g.fill()}}
 if(ty==='ninja'){g.fillStyle='#14161f';g.fillRect(x-r,y-r*.42,r*2,r*.34);g.fillStyle='#d33';g.fillRect(x-r,y-r*.28,r*2,r*.05);g.fillStyle='#c9ccd6';g.fillRect(x-r*.28,y-r*.4,r*.56,r*.3);g.fillStyle='#14161f';g.fillRect(x-r*.22,y-r*.35,r*.44,r*.2)}
 if(b.poison>0){g.fillStyle='rgba(90,255,80,.28)';g.fillRect(x-r,y-r,r*2,r*2)}
 if(b.flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.85,b.flash*8)+')';g.fillRect(x-r,y-r,r*2,r*2)}
 if(b.frozen>0){g.fillStyle='rgba(150,215,255,.5)';g.fillRect(x-r,y-r,r*2,r*2);g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.5;g.beginPath();g.moveTo(x-r*.5,y-r*.6);g.lineTo(x+r*.1,y+r*.1);g.lineTo(x+r*.5,y-r*.2);g.moveTo(x+r*.1,y+r*.1);g.lineTo(x-r*.2,y+r*.7);g.stroke()}
 g.restore();
 g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(x-r*.36,y-r*.5,r*.32,r*.16,-.6,0,6.283);g.fill();
